<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice Fatake</title>
<meta name="description" content="Record 2 seconds of your voice, stuff it in a firecracker, send it as a Diwali gift.">
<meta property="og:title" content="🪔 Someone sent you a voice firecracker!">
<meta property="og:description" content="Tap to light it. Happy Diwali!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧨</text></svg>">
<style>
:root{--bg:#120a1f;--ink:#fff4e0;--dim:#b9a7c9;--gold:#ffb627;--red:#ff4d3d;--chip:#24163a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
main{height:100dvh;max-width:480px;margin:auto;display:grid;grid-template-rows:auto 1fr auto auto auto;gap:12px;padding:12px 16px max(16px,env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;gap:8px}
header b{font-size:22px;color:var(--gold)}header span{color:var(--dim);font-size:14px}
canvas{width:100%;height:100%;min-height:0;border-radius:18px;background:radial-gradient(ellipse at 50% 120%,#3a1d4f,#0b0614 70%)}
#msg{text-align:center;min-height:1.3em;font-size:17px}
#crackers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#crackers button{background:var(--chip);border:2px solid transparent;border-radius:14px;padding:8px 4px;color:var(--ink);display:grid;gap:2px;justify-items:center}
#crackers button i{font-style:normal;font-size:30px}
#crackers button b{font-size:15px}#crackers button small{color:var(--dim);font-size:11px}
#crackers button[aria-pressed=true]{border-color:var(--gold);background:#3b2410}
.row{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.big{flex:1;border:0;border-radius:16px;padding:16px 10px;font-size:18px;font-weight:700;background:var(--gold);color:#2a1300}
.big.alt{background:var(--chip);color:var(--ink)}
.big:disabled{opacity:.5}
#rec{position:relative;overflow:hidden}
#rec span{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(0)}
#rec em{position:relative;font-style:normal}
input{flex:1;min-width:0;border:2px solid var(--chip);background:transparent;color:var(--ink);border-radius:14px;padding:0 12px;font:inherit}
a{color:var(--gold)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><b>फटाका Voice</b><span>Diwali voice crackers 🪔</span></header>
  <canvas id="sky" aria-label="Firecracker preview"></canvas>
  <p id="msg" aria-live="polite">Pick a cracker, record 2 seconds</p>
  <div id="crackers" role="group" aria-label="Firecracker"></div>
  <div id="send-ui" class="row-col">
    <div class="row" id="s-rec"><button class="big" id="rec"><span></span><em>🎙 Record 2 sec</em></button></div>
    <div id="s-ready" hidden style="display:grid;gap:8px">
      <div class="row"><button class="big alt" id="redo">🎙 Redo</button><button class="big" id="light1">🔥 Light it</button></div>
      <div class="row"><input id="name" placeholder="Your name" maxlength="24" aria-label="Your name"><button class="big" id="send" style="flex:0 0 auto">🎁 Send</button></div>
    </div>
  </div>
  <div id="get-ui" hidden style="display:grid;gap:8px">
    <button class="big" id="light2">🔥 Light it!</button>
    <a href="./" style="text-align:center">Make your own voice cracker →</a>
  </div>
</main>
<script>
// shortcut: names/sounds are a first pass; real Marathi names to be confirmed by the user
const CRACKERS = {
  baan:    {emoji:'🚀', mr:'बाण',    en:'Rocket'},
  bhuinala:{emoji:'🎇', mr:'भुईनळा', en:'Flower pot'},
  lavangi: {emoji:'🧨', mr:'लवंगी',  en:'String pops'},
};
const $ = s => document.querySelector(s);
let type = 'baan', voice = null, voiceB64 = '', voiceMime = '';

// ---------- audio ----------
let ac, out, noise;
function AC(){
  if(!ac){
    ac = new (window.AudioContext||webkitAudioContext)();
    out = ac.createDynamicsCompressor(); out.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate*3, ac.sampleRate);
    const d = noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  return ac;
}
function play(buf,t,dest,rate=1,off=0,dur){const s=ac.createBufferSource();s.buffer=buf;s.playbackRate.value=rate;s.connect(dest);s.start(t,off,dur);return s}
function env(t,a,peak,hold,rel){const g=ac.createGain(),p=g.gain;p.setValueAtTime(0,t);p.linearRampToValueAtTime(peak,t+a);p.setValueAtTime(peak,t+a+hold);p.exponentialRampToValueAtTime(.001,t+a+hold+rel);g.connect(out);return g}
function filt(type,f,q=1,to){const n=ac.createBiquadFilter();n.type=type;n.frequency.value=f;n.Q.value=q;if(to)n.connect(to);return n}
function bang(t,size){
  play(noise,t,filt('lowpass',2500,1,env(t,.002,size,.01,.08+.3*size)),1,Math.random()*2,.6);
  const o=ac.createOscillator();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.3);
  o.connect(env(t,.002,size*.9,0,.3));o.start(t);o.stop(t+.45);
}
const at = (t,fn) => setTimeout(fn, Math.max(0,(t-ac.currentTime)*1000));

// cut the silence around the voice so the sound lands on the beat
function trim(buf){
  const d=buf.getChannelData(0);let m=0;for(const v of d)m=Math.max(m,Math.abs(v));
  const th=m*.08;let a=0,b=d.length-1;while(a<b&&Math.abs(d[a])<th)a++;while(b>a&&Math.abs(d[b])<th)b--;
  a=Math.max(0,a-400);b=Math.min(d.length,b+800);
  const n=ac.createBuffer(1,Math.max(1,b-a),buf.sampleRate),nd=n.getChannelData(0),k=m>0?.9/m:1;
  for(let i=0;i<nd.length;i++)nd[i]=d[a+i]*k;return n;
}

const FX = {
  // voice rides the whistle upwards, then bursts
  baan(v,t){
    const fly=Math.min(2,Math.max(.8,v.duration/1.2));
    const w=filt('bandpass',700,3,env(t,.05,.5,fly-.1,.08));w.frequency.exponentialRampToValueAtTime(5000,t+fly);
    play(noise,t,w,1,0,fly+.2);
    const s=play(v,t+.05,env(t+.05,.03,1.1,fly-.1,.1),.85);s.playbackRate.linearRampToValueAtTime(1.6,t+fly);
    const b=t+fly+.08;bang(b,1.2);
    for(let i=0;i<14;i++)bang(b+.25+Math.random()*.9,.08+Math.random()*.1);
    vis.rocket(t,fly);return fly+1.4;
  },
  // voice sprays out in a fizzing chorus
  bhuinala(v,t){
    const dur=Math.max(2.6,v.duration+1.2);
    play(noise,t,filt('highpass',2500,1,env(t,.3,.3,dur-.8,.5)),1,0,dur);
    [[0,1,1],[.09,1.07,.45],[.18,.93,.45]].forEach(([d,r,g])=>play(v,t+.25+d,filt('highpass',250,1,env(t+.25+d,.02,g,v.duration/r,.2)),r));
    for(let i=0;i<40;i++)bang(t+.3+Math.random()*(dur-.6),.05+Math.random()*.06);
    vis.fountain(t,dur);return dur+.3;
  },
  // voice chopped into a string of pops
  lavangi(v,t){
    const n=12,g=.09;let tt=t;
    for(let i=0;i<n;i++){
      const off=(v.duration-g)*i/(n-1);
      play(v,tt,env(tt,.003,1,g-.03,.03),1,Math.max(0,off),g);
      bang(tt,.3+Math.random()*.2);vis.pop(tt,.5);
      tt+=.08+Math.random()*.12;
    }
    bang(tt+.1,1.3);play(v,tt+.1,env(tt+.1,.005,.9,v.duration,.1));vis.pop(tt+.1,1.6);
    return tt-t+v.duration+.5;
  },
};
function light(){
  AC().resume();if(!voice)return;
  const btns=document.querySelectorAll('#light1,#light2');btns.forEach(b=>b.disabled=true);
  const d=FX[type](voice,ac.currentTime+.08);
  setTimeout(()=>btns.forEach(b=>b.disabled=false),d*1000);
}

// ---------- visuals ----------
const cv=$('#sky'),cx=cv.getContext('2d');let P=[],idle=true;
function fit(){const r=devicePixelRatio||1;cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r}
addEventListener('resize',fit);
const HUES=[40,10,330,190,55,280];
function spark(x,y,vx,vy,life,hue,g=.06){P.push({x,y,vx,vy,life,max:life,hue,g})}
const vis={
  rocket(t,fly){at(t,()=>{idle=false;const W=cv.width,H=cv.height,f0=performance.now();
    (function up(){const k=Math.min(1,(performance.now()-f0)/(fly*1000)),x=W/2+Math.sin(k*6)*W*.04,y=H-(H*.7)*k;
      for(let i=0;i<3;i++)spark(x,y,(Math.random()-.5)*1.5,2+Math.random()*2,25,40,0);
      if(k<1)requestAnimationFrame(up);else{const h=HUES[Math.random()*6|0];
        for(let i=0;i<160;i++){const a=Math.random()*7,s=Math.random()*9*devicePixelRatio;spark(x,y,Math.cos(a)*s,Math.sin(a)*s,60+Math.random()*40,h+Math.random()*30)}}})()})},
  fountain(t,dur){at(t,()=>{idle=false;const f0=performance.now();
    (function sp(){const W=cv.width,H=cv.height,s=devicePixelRatio;
      for(let i=0;i<10;i++)spark(W/2,H-10,(Math.random()-.5)*5*s,-(6+Math.random()*7)*s,50+Math.random()*30,30+Math.random()*30,.18*s);
      if(performance.now()-f0<dur*1000)requestAnimationFrame(sp)})()})},
  pop(t,size){at(t,()=>{idle=false;const W=cv.width,H=cv.height,x=W*(.15+Math.random()*.7),y=H*(.6+Math.random()*.35),h=HUES[Math.random()*6|0];
    for(let i=0;i<40*size;i++){const a=Math.random()*7,s=Math.random()*6*size*devicePixelRatio;spark(x,y,Math.cos(a)*s,Math.sin(a)*s,20+Math.random()*20,h,.1)}})},
};
(function draw(){
  const W=cv.width,H=cv.height;
  cx.globalCompositeOperation='source-over';cx.fillStyle='rgba(11,6,20,.28)';cx.fillRect(0,0,W,H);
  if(idle||!P.length){cx.globalAlpha=.9;cx.font=`${H*.35}px serif`;cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(CRACKERS[type].emoji,W/2,H/2+Math.sin(performance.now()/400)*6);cx.globalAlpha=1}
  cx.globalCompositeOperation='lighter';
  P=P.filter(p=>p.life-->0);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;
    cx.fillStyle=`hsla(${p.hue},100%,${55+25*p.life/p.max}%,${p.life/p.max})`;cx.fillRect(p.x,p.y,2.5*devicePixelRatio,2.5*devicePixelRatio)}
  if(!P.length)idle=true;
  requestAnimationFrame(draw);
})();

// ---------- recording ----------
async function record(){
  AC().resume();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}})}
  catch{msg('Mic blocked — allow microphone and try again');return}
  const mime=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const r=new MediaRecorder(stream,{mimeType:mime,audioBitsPerSecond:12000}),chunks=[];
  r.ondataavailable=e=>chunks.push(e.data);
  const bar=$('#rec span');bar.style.transition='none';bar.style.transform='scaleX(0)';bar.offsetWidth;
  bar.style.transition='transform 2s linear';bar.style.transform='scaleX(1)';
  $('#rec em').textContent='🔴 Say something!';$('#rec').disabled=true;
  r.start();setTimeout(()=>r.stop(),2000);
  await new Promise(res=>r.onstop=res);stream.getTracks().forEach(t=>t.stop());
  bar.style.transition='none';bar.style.transform='scaleX(0)';$('#rec em').textContent='🎙 Record 2 sec';$('#rec').disabled=false;
  const blob=new Blob(chunks,{type:r.mimeType});
  try{await setVoice(blob)}catch{msg('Could not read that recording, try again');return}
  voiceMime=r.mimeType.split(';')[0];
  voiceB64=(await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(blob)}))
    .split(',')[1].replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  $('#s-rec').hidden=true;$('#s-ready').hidden=false;msg('Nice! Light it to hear the cracker');light();
}
async function setVoice(blob){voice=trim(await AC().decodeAudioData(await blob.arrayBuffer()))}

// ---------- share ----------
async function send(){
  const name=$('#name').value.trim();
  // voice lives in the #hash, so nothing is uploaded anywhere
  const p=new URLSearchParams({c:type,m:voiceMime,a:voiceB64});if(name)p.set('n',name);
  const url=location.origin+location.pathname+'#'+p;
  const c=CRACKERS[type],text=`🪔 ${name||'Someone'} sent you a voice ${c.mr} ${c.emoji}! Tap to light it:`;
  if(navigator.share){try{await navigator.share({title:'Voice Fatake',text,url});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text+' '+url);msg('Link copied — paste it on WhatsApp!')}
  catch{prompt('Copy this link:',url)}
}

// ---------- ui ----------
const msg=t=>$('#msg').textContent=t;
for(const [k,c] of Object.entries(CRACKERS)){
  const b=document.createElement('button');b.innerHTML=`<i>${c.emoji}</i><b>${c.mr}</b><small>${c.en}</small>`;
  b.setAttribute('aria-pressed',k===type);
  b.onclick=()=>{type=k;document.querySelectorAll('#crackers button').forEach(x=>x.setAttribute('aria-pressed',x===b));if(voice)light()};
  $('#crackers').append(b);
}
$('#rec').onclick=record;$('#redo').onclick=()=>{$('#s-ready').hidden=true;$('#s-rec').hidden=false;record()};
$('#light1').onclick=$('#light2').onclick=light;$('#send').onclick=send;

(async function receive(){
  const p=new URLSearchParams(location.hash.slice(1));if(!p.get('a'))return;
  $('#send-ui').hidden=true;$('#crackers').hidden=true;$('#get-ui').hidden=false;
  type=CRACKERS[p.get('c')]?p.get('c'):'baan';const c=CRACKERS[type];
  msg(`${p.get('n')||'Someone'} sent you a voice ${c.mr} ${c.emoji}`);
  try{
    const bin=atob(p.get('a').replace(/-/g,'+').replace(/_/g,'/'));
    await setVoice(new Blob([Uint8Array.from(bin,ch=>ch.charCodeAt(0))],{type:p.get('m')||''}));
  }catch{msg('This cracker got wet 💧 (link broken)');$('#light2').disabled=true}
})();
fit();
</script>
</body>
</html>
